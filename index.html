
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f5f0;
            color: #333;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #344b3b;
            margin-bottom: 30px;
        }

        h2 {
            color: #344b3b;
            margin-bottom: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .product-card {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .product-image {
            width: 100%;
            height: 220px;
            margin-bottom: 15px;
            overflow: hidden;
            border-radius: 10px;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-card h3 {
            margin-bottom: 10px;
        }

        .price {
            color: #527b5d;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn {
            background-color: #527b5d;
            color: white;
        }

        .add-btn:hover {
            background-color: #344b3b;
        }

        .cart-section {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item h3 {
            font-size: 16px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            background-color: #e7eee7;
            color: #344b3b;
            font-weight: bold;
        }

        .remove-btn {
            background-color: #e9dada;
            color: #a12d2d;
        }

        .total {
            text-align: right;
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            color: #344b3b;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .products {
                grid-template-columns: 1fr;
            }

            .cart-item {
                flex-wrap: wrap;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>My Shopping Store </h1>

        <!-- Product Section -->

        <h2>Our Products</h2>

        <div class="products" id="productList"></div>


        <!-- Shopping Cart Section -->

        <div class="cart-section">

            <h2>My Shopping Cart </h2>

            <div id="cartItems"></div>

            <div class="total" id="totalPrice">
                Total: Rs. 0
            </div>

        </div>

    </div>


    <script>

       

        const products = [

            {
                id: 1,
                name: "Wireless Headphones",
                price: 2500,
                image: "https://i.pinimg.com/736x/06/3d/da/063dda2544b75b2505c52b8055610514.jpg"
            },

            {
                id: 2,
                name: "Smart Watch",
                price: 4500,
                image: "https://i.pinimg.com/736x/98/30/3b/98303b96001fedcf20cc92266db82f39.jpg"
            },

            {
                id: 3,
                name: "Running Shoes",
                price: 3500,
                image: "https://i.pinimg.com/1200x/f2/b1/cb/f2b1cbc6612c81aac1f31a1355638c7c.jpg"
            }

        ];


        
        let cart = [];


       
        const productList = document.getElementById("productList");

        const cartItems = document.getElementById("cartItems");

        const totalPrice = document.getElementById("totalPrice");


       

        const displayProducts = () => {

            productList.innerHTML = products.map((product) => {

                return `

                    <div class="product-card">

                        <div class="product-image">

                            <img src="${product.image}" alt="${product.name}">

                        </div>

                        <h3>${product.name}</h3>

                        <p class="price">
                            Rs. ${product.price.toLocaleString("en-PK")}
                        </p>

                        <button class="add-btn"
                            data-action="add"
                            data-id="${product.id}">

                            Add to Cart

                        </button>

                    </div>

                `;

            }).join("");

        };


        

        const addToCart = (id) => {

            const product = products.find((item) => item.id === id);

            const existingProduct = cart.find((item) => item.id === id);

            if (existingProduct) {

                cart = cart.map((item) =>

                    item.id === id

                        ? { ...item, quantity: item.quantity + 1 }

                        : item

                );

            } else {

                cart = [...cart, { ...product, quantity: 1 }];

            }

            displayCart();

        };


      

        const changeQuantity = (id, change) => {

            cart = cart.map((item) => {

                if (item.id === id) {

                    return {

                        ...item,

                        quantity: item.quantity + change

                    };

                }

                return item;

            }).filter((item) => item.quantity > 0);

            displayCart();

        };


        

        const removeFromCart = (id) => {

            cart = cart.filter((item) => item.id !== id);

            displayCart();

        };


        

        const displayCart = () => {

            if (cart.length === 0) {

                cartItems.innerHTML = `

                    <p class="empty">Your cart is empty!</p>

                `;

            } else {

                cartItems.innerHTML = cart.map((item) => {

                    return `

                        <div class="cart-item">

                            <div>

                                <h3>${item.name}</h3>

                                <p>
                                    Rs. ${item.price.toLocaleString("en-PK")}
                                </p>

                            </div>


                            <div class="quantity">

                                <button
                                    data-action="decrease"
                                    data-id="${item.id}">

                                    −

                                </button>

                                <span>${item.quantity}</span>

                                <button
                                    data-action="increase"
                                    data-id="${item.id}">

                                    +

                                </button>

                            </div>


                            <button
                                class="remove-btn"
                                data-action="remove"
                                data-id="${item.id}">

                                Remove

                            </button>

                        </div>

                    `;

                }).join("");

            }


            

            const total = cart.reduce((sum, item) => {

                return sum + item.price * item.quantity;

            }, 0);


            totalPrice.innerHTML = `

                Total: Rs. ${total.toLocaleString("en-PK")}

            `;

        };


        

        document.addEventListener("click", (event) => {

            const button = event.target.closest("button[data-action]");

            if (!button) return;

            const id = Number(button.dataset.id);

            const action = button.dataset.action;


            if (action === "add") {

                addToCart(id);

            }

            else if (action === "increase") {

                changeQuantity(id, 1);

            }

            else if (action === "decrease") {

                changeQuantity(id, -1);

            }

            else if (action === "remove") {

                removeFromCart(id);

            }

        });


        
        displayProducts();

        displayCart();

    </script>

</body>
</html>
